# Classificação visual manual (Etapa 1), feita quadro a quadro nas folhas de 2 fps
# (_tmp/folhas/*.jpg) e conferida nas grades de recorte. É a parte do ranking que não é medida
# por algoritmo: tipo de plano, quem aparece, lugar e reprovações dos filtros 2 e 3.
#
# Campos
#   local      agrupamento por lugar (GPS do arquivo + o que aparece). Dois espaços não usam o mesmo local.
#   cx         centro do recorte 9:16 na fonte horizontal (fração da largura). Vertical: null.
#   icone      quanto o plano "diz Barcelona sem explicação" (0–1). Julgamento editorial, usado no gancho,
#              na arquitetura e na vista.
#   marina     a Marina aparece (de costas ou de perfil). Permitido (CLAUDE.md, "Quem aparece"),
#              mas o conceito é POV: penaliza no ranking.
#   reprova    trechos reprovados com o filtro (F1 a F7) e o motivo.
#   audio      "proprio" | "substituir" (fala ou música no áudio do trecho; visual pode entrar com
#              ambiente de outro trecho).
#
# Todos os 21 arquivos: iPhone 17 Pro, GPS em Barcelona, 09–10/03/2026, sem marca d'água nem texto
# sobreposto (F7 aprovado), resolução 3840×2160 (F6: recorte 9:16 sem upscale) ou vertical
# 1214×2160 / 2160×3840 (≥ 1080×1920).

